name: Short address

# A short Firebase address that sends people straight to Quickzy, keeping
# the rest of the link (qzy.web.app/join/123456 → quickzy.web.app/join/123456).
# Takes the first of the names below that is free (or already ours).
on:
  push:
    branches: [main, 'claude/**']
    paths: ['.github/workflows/short.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: short-address
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT: akylduukodo
      FIREBASE: npx -y firebase-tools@12.9.1
      NAMES: qzy qzz qzapp quickz playqz
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sign in with the service account
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AKYLDUUKODO }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Find or make the short site
        run: |
          SITE=''
          for n in $NAMES; do
            if $FIREBASE hosting:sites:get "$n" --project "$PROJECT" > /dev/null 2>&1; then SITE="$n"; echo "Already ours: $n"; break; fi
            if $FIREBASE hosting:sites:create "$n" --project "$PROJECT" --non-interactive > /dev/null 2>&1; then SITE="$n"; echo "Made: $n"; break; fi
            echo "Taken: $n"
          done
          if [ -z "$SITE" ]; then echo "::error::None of the short names were free."; exit 1; fi
          echo "SITE=$SITE" >> "$GITHUB_ENV"
      - name: Publish the forwarding page
        run: |
          mkdir -p short && cd short
          cat > index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Quickzy</title>
          <meta http-equiv="refresh" content="0; url=https://quickzy.web.app/">
          <a href="https://quickzy.web.app/">Quickzy</a>
          HTML
          cat > firebase.json <<JSON
          { "hosting": { "site": "$SITE", "public": ".", "ignore": ["firebase.json", "**/.*"],
            "redirects": [{ "regex": "^/(.*)$", "destination": "https://quickzy.web.app/:1", "type": 302 }],
            "headers": [{ "source": "**", "headers": [{ "key": "X-Content-Type-Options", "value": "nosniff" }] }] } }
          JSON
          echo '{"projects":{"default":"akylduukodo"}}' > .firebaserc
          $FIREBASE deploy --only hosting --project "$PROJECT" --non-interactive
          echo "### Short address: https://$SITE.web.app" >> "$GITHUB_STEP_SUMMARY"
          echo "SHORT ADDRESS: https://$SITE.web.app"
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
