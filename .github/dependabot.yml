# Keeps the build tools up to date with security fixes: GitHub Actions and
# the Windows app's packages. Dependabot opens a pull request for each update.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
